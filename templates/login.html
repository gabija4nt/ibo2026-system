<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBO 2026 Login</title>
</head>

<body class="login-page">

    <div class="login-card">

        <h1 class="login-logo">
            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="IBO Logo"
                class="login-logo-image"
            >
            <span>IBO 2026</span>
        </h1>

        <p class="login-subtitle">
            Participant Wellbeing & Check-in System
        </p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="login-footer">
            Lithuania | Vilnius University
        </div>

    </div>

</body>
</html>
