{% extends "base.html" %}

{% block title %}
Leader Dashboard
{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}

{% for block in dashboard_data %}

<div class="card">

    <h2>{{ block.question.text }}</h2>

    <div class="student-graphs">

        {% for item in block.students %}

        <div class ="student-card">

            <h4>{{ item.student.name }}</h4>

            <div class="chart-container">
                <canvas
                    id="chart_{{ block.question.id }}_{{ item.student.id }}">
                </canvas>
                <script>

                    new Chart(
                        document.getElementById(
                            'chart_{{ block.question.id }}_{{ item.student.id }}'
                        ),
                        {
                            type: 'line',
                    
                            data: {
                                labels: {{ range(1, item.answers|length + 1) | list | tojson }},
                    
                                datasets: [

                                {
                                    label: '{{ item.student.name }}',

                                    data: {{ item.answers | tojson }},

                                    borderWidth: 3,
                                    tension: 0.4,
                                    pointRadius: 5
                                },

                                ]
                            },
                    
                            options: {
                                responsive: true,

                                plugins: {
                                    legend: {
                                        display: false
                                    }
                                },

                                scales: {
                                    x: {
                                        display: false
                                    },
                                    y: {
                                        min: 1,
                                        max: 5,

                                        ticks: {
                                            stepSize: 1,
                                            callback: function(value) {
                                                return Number.isInteger(value) ? value : '';
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    );
                    
                    </script>
            </div>
        </div>

        {% endfor %}
    </div>
</div>

{% endfor %}

{% endblock %}
