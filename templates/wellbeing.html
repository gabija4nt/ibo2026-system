{% extends "base.html" %}

{% block title %}
Wellbeing Survey
{% endblock %}

{% block content %}

    <div class="container-small">
        <h1 class="page-title">
            💚 Wellbeing Survey
        </h1>
        <div class="card">
            {% if message %}
                <div class="message {{ 'success' if '✅' in message else 'error' }}">
                    {{ message }}
                </div>
            {% endif %}
            <form method="POST">
                <label>Participant ID</label>
                <input type="text" name="nfc_id" placeholder="Scan or enter Participant ID" required autofocus>

                <h2>Rate your experience today:</h2>

                {% for question in questions %}

                <div class="question">

                    <p>{{ loop.index }}. {{ question.text }}</p>
                
                    <div class="stars">
                
                        <input type="radio"
                               name="question_{{ question.id }}"
                               id="q{{ question.id }}_1"
                               value="1">
                        <label for="q{{ question.id }}_1">😢</label>
                
                        <input type="radio"
                               name="question_{{ question.id }}"
                               id="q{{ question.id }}_2"
                               value="2">
                        <label for="q{{ question.id }}_2">😕</label>
                
                        <input type="radio"
                               name="question_{{ question.id }}"
                               id="q{{ question.id }}_3"
                               value="3">
                        <label for="q{{ question.id }}_3">😐</label>
                
                        <input type="radio"
                               name="question_{{ question.id }}"
                               id="q{{ question.id }}_4"
                               value="4">
                        <label for="q{{ question.id }}_4">🙂</label>
                
                        <input type="radio"
                               name="question_{{ question.id }}"
                               id="q{{ question.id }}_5"
                               value="5">
                        <label for="q{{ question.id }}_5">😄</label>
                
                    </div>
                
                </div>

                {% endfor %}

                <button type="submit">💚 Submit</button>
            </form>
        </div>
    </div>
{% endblock %}
