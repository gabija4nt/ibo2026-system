{% extends "base.html" %}

{% block title %}
Check-in
{% endblock %}

{% block content %}
    <div class="container-small">
        <h1 class="page-title">
            📲 Check-in
        </h1>
        <div class="card">
            {% if message %}
                <div class="message {{ 'success' if '✅' in message else 'error' }}">
                    {{ message }}
                </div>
            {% endif %}
            <form method="POST">
                
                <label>Event</label>
                <select name="event_name" required>

                    {% if active_events %}
                    <optgroup label="Recommended Events">

                        {% for event in active_events %}
                        <option value="{{ event.name }}">
                            {{ event.name }}
                        </option>
                        {% endfor %}

                    </optgroup>
                    {% endif %}

                    <optgroup label="All Events">

                        {% for event in all_events %}
                        <option value="{{ event.name }}">
                            {{ event.name }}
                        </option>
                        {% endfor %}

                    </optgroup>
                </select>
                <label>Participant ID</label>
                <input type="text" name="nfc_id" placeholder="Scan or enter Participant ID" required autofocus>
                <p class="nfc-hint">📡 Hold the Participant card with barcode near the device or enter the ID manually</p>
                <button type="submit">
                    📲 Check In
                </button>
            </form>
        </div>
    </div>
    {% endblock %}
